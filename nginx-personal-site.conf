# Personal Site - huangml.com (HTTPS)
# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name huangml.com www.huangml.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://huangml.com$request_uri;
    }
}

# HTTPS: static files + API reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huangml.com www.huangml.com;

    ssl_certificate     /etc/letsencrypt/live/huangml.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huangml.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:PersonalSiteSSL:10m;
    ssl_session_tickets on;

    # OCSP stapling: avoid browser querying CA's OCSP server (slow/blocked in China)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/huangml.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Redirect www to non-www
    if ($host = "www.huangml.com") {
        return 301 https://huangml.com$request_uri;
    }

    # Frontend static files
    root /var/www/personal-site/dist;
    index index.html;

    client_max_body_size 10m;

    # Vite assets (long cache)
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Uploaded images
    location /uploads/ {
        alias /var/www/personal-site/uploads/;
        expires 30d;
        access_log off;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap proxy
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
